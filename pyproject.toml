[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "freshbrain-ai-engine"
version = "0.1.0"
description = "FreshBrain internal AI service"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "anthropic>=0.70,<1",
    "asyncpg>=0.30,<1",
    "fastapi>=0.120,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.10,<3",
    "pyjwt>=2.9,<3",
    "sqlalchemy[asyncio]>=2.0.40,<3",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools.packages.find]
include = ["app*"]
